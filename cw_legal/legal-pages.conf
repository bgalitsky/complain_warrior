# Include INSIDE the existing Complaint Warrior server { ... } block.
# Keep this snippet OUTSIDE /etc/nginx/conf.d: it contains location directives.
location = /privacy.html {
    alias /var/www/complaint-warrior-public/privacy.html;
    default_type text/html;
    charset utf-8;
    auth_basic off;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
location = /terms.html {
    alias /var/www/complaint-warrior-public/terms.html;
    default_type text/html;
    charset utf-8;
    auth_basic off;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
location = /about.html {
    alias /var/www/complaint-warrior-public/about.html;
    default_type text/html;
    charset utf-8;
    auth_basic off;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
